<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}scoped-rag{% endblock %}</title>
<style>
:root {
  --bg: #f6f7f5; --surface: #fff; --fg: #1d2421; --muted: #5d6b65; --line: #dde3df;
  --accent: #0f7a5c; --accent-soft: #e2f1eb; --warn: #9a5b12; --warn-soft: #f6ecdc;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121715; --surface: #1a201e; --fg: #e4ebe7; --muted: #95a39c; --line: #2c3532;
    --accent: #4cc39c; --accent-soft: #173a2f; --warn: #e0a85a; --warn-soft: #3a2c17;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); line-height: 1.55;
  font: 15px/1.55 "Noto Sans TC", -apple-system, "Microsoft JhengHei", system-ui, sans-serif;
  padding: 24px max(16px, env(safe-area-inset-right)) 64px max(16px, env(safe-area-inset-left));
}
.wrap { max-width: 860px; margin: 0 auto; display: grid; gap: 20px; }
h1 { font-size: 1.5rem; margin: 0; }
h2 { font-size: 1.05rem; margin: 0 0 8px; }
a { color: var(--accent); }
nav { display: flex; gap: 14px; font-size: .9rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
.sub { color: var(--muted); margin: 0; font-size: .9rem; }
label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 4px; }
input, select, textarea, button {
  font: inherit; color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; max-width: 100%;
}
button { background: var(--accent-soft); color: var(--accent); border-color: transparent; cursor: pointer; font-weight: 500; }
button:hover { filter: brightness(.97); }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
.grow { flex: 1 1 320px; }
.pill { display: inline-block; font-size: .72rem; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th, td { text-align: left; padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; border-top: 0; }
code { font-family: ui-monospace, Consolas, monospace; font-size: .85em; }
.note { font-size: .82rem; color: var(--muted); }
.answer { background: var(--accent-soft); border-radius: 6px; padding: 12px; }
.answer.refused { background: var(--warn-soft); }
ul.sources { margin: 8px 0 0; padding-left: 18px; font-size: .85rem; color: var(--muted); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>scoped-rag</h1>
    <p class="sub">權限過濾在檢索之內，不在檢索之後。</p>
    <nav><a href="/">提問</a><a href="/documents">文件與授權</a></nav>
  </header>
  {% block body %}{% endblock %}
  <p class="note">身分由下拉選單指定，是 demo 的刻意簡化：本專案要證明的是「知道提問者是誰之後」的行為，正式部署會在這層之前放上登入工作階段。</p>
</div>
</body>
</html>
