[project]
name = "scoped-rag"
version = "0.1.0"
description = "Permission-aware RAG: the access filter runs inside retrieval, not after it."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.18",
    "pyyaml>=6.0.2",
    "httpx>=0.27.2",
]

[project.optional-dependencies]
parse = ["pypdf>=5.1.0", "python-docx>=1.1.2"]
local-embed = ["sentence-transformers>=3.3.0"]
pg = ["psycopg[binary]>=3.2.3"]

[project.scripts]
scoped-rag = "scoped_rag.cli:main"

[dependency-groups]
dev = ["pytest>=8.3.0", "ruff>=0.8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scoped_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
